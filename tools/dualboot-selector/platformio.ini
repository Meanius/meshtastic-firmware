; T-Deck dual-boot selector: lives in the factory partition, offers Meshtastic or MeshCore at power-on.
; The partition table must be the same in all three images (dualboot_16MB.csv).
[env:tdeck-selector]
platform = platformio/espressif32@6.11.0
board = t-deck
framework = arduino
board_build.partitions = dualboot_16MB.csv
build_flags =
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D CORE_DEBUG_LEVEL=1
lib_deps =
  adafruit/Adafruit ST7735 and ST7789 Library @ ^1.11.0
